name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
        exclude:
          # setup-python ships no 3.9 build for Ubuntu 26.04 (ubuntu-latest);
          # test 3.9 on Linux with the previous LTS instead.
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (standard library only, no installs)
        run: python -m unittest discover -s tests -v
      - name: Package builds and the command starts
        run: |
          python -m pip install .
          healthage --version
